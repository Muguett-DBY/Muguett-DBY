<svg xmlns="http://www.w3.org/2000/svg" width="640" height="584" viewBox="0 0 640 584" role="img" aria-labelledby="title description">
  <title id="title">Hello, I'm Custard</title>
  <desc id="description">I build useful products and little worlds with code. Bachelor's and Master's in Data Science; PhD Year 0 in Artificial Intelligence.</desc>
  <style>
    .surface{fill:#f7f8fc}.edge{stroke:#e1e0ed}.ink{fill:#252d47}.muted{fill:#68718a}.mint{fill:#247965}.lavender{fill:#71609c}.card{fill:#fff}.star{fill:#bca7ff}
    @media(prefers-color-scheme:dark){.surface{fill:#11182b}.edge{stroke:#303950}.ink{fill:#f2effb}.muted{fill:#b1bad0}.mint{fill:#68efd0}.lavender{fill:#bca7ff}.card{fill:#192238}}
    @media(prefers-reduced-motion:no-preference){.twinkle{animation:twinkle 6s ease-in-out infinite}@keyframes twinkle{0%,100%{opacity:.35}50%{opacity:1}}}
  </style>
  <rect class="surface edge" x="1" y="1" width="638" height="582" rx="24"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <circle cx="38" cy="38" r="5" fill="#efa1a2"/><circle cx="58" cy="38" r="5" fill="#ffd783"/><circle cx="78" cy="38" r="5" fill="#68c6ac"/>
    <text class="muted" x="104" y="44" font-family="Consolas,monospace" font-size="19" letter-spacing="1">HELLO / I'M CUSTARD</text>
    <text class="ink" x="32" y="122" font-size="47" font-weight="700">A little data.</text>
    <text class="ink" x="32" y="181" font-size="47" font-weight="700">A little imagination.</text>
    <text class="muted" x="34" y="239" font-size="28">Building useful products</text>
    <text class="muted" x="34" y="277" font-size="28">and little worlds with code.</text>
    <rect class="card edge" x="28" y="316" width="584" height="108" rx="16"/>
    <path d="M50 340v62" stroke="#68c6ac" stroke-width="4" stroke-linecap="round"/>
    <text class="mint" x="74" y="352" font-family="Consolas,monospace" font-size="22" letter-spacing="1.5">DATA SCIENCE</text>
    <text class="ink" x="74" y="391" font-size="32" font-weight="600">Bachelor's &amp; Master's</text>
    <rect class="card edge" x="28" y="442" width="584" height="108" rx="16"/>
    <path d="M50 466v62" stroke="#bca7ff" stroke-width="4" stroke-linecap="round"/>
    <text class="lavender" x="74" y="478" font-family="Consolas,monospace" font-size="21" letter-spacing="1">ARTIFICIAL INTELLIGENCE</text>
    <text class="ink" x="74" y="517" font-size="32" font-weight="600">PhD · Year 0</text>
  </g>
  <path class="star twinkle" d="m574 84 4 12 12 4-12 4-4 12-4-12-12-4 12-4z"/>
</svg>
