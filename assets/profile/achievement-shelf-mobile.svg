<svg xmlns="http://www.w3.org/2000/svg" width="540" height="110" viewBox="0 0 540 110" role="img" aria-labelledby="title desc">
  <title id="title">Achievement shelf</title>
  <desc id="desc">A little shelf for badges earned on GitHub.</desc>
  <style>
    .surface{fill:#f7f8fc}.edge{stroke:#e1e0ed}.ink{fill:#252d47}.muted{fill:#68718a}.star{fill:#a18be0}.medal{fill:#fff;stroke:#e1e0ed}
    @media(prefers-color-scheme:dark){.surface{fill:#11182b}.edge{stroke:#303950}.ink{fill:#f2effb}.muted{fill:#b1bad0}.star{fill:#bca7ff}.medal{fill:#192238;stroke:#303950}}
    @media(prefers-reduced-motion:no-preference){.twinkle{animation:twinkle 6s ease-in-out infinite}@keyframes twinkle{0%,100%{opacity:.4}50%{opacity:1}}}
  </style>
  <rect class="surface edge" x="1" y="1" width="538" height="108" rx="18"/>
  <circle cx="27" cy="25" r="4" fill="#efa1a2"/><circle cx="42" cy="25" r="4" fill="#ffd783"/><circle cx="57" cy="25" r="4" fill="#68c6ac"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text class="muted" x="77" y="30" font-family="Consolas,monospace" font-size="16" letter-spacing="1.5">MILESTONES / ACHIEVEMENTS</text>
    <text class="ink" x="27" y="72" font-size="30" font-weight="700">A little shelf of</text>
    <text class="ink" x="27" y="99" font-size="30" font-weight="700">GitHub badges.</text>
  </g>
  <circle class="medal" cx="466" cy="65" r="29"/>
  <path d="m466 46 4.8 10.3 11.2 1.4-8.2 7.7 2 11-9.8-5.6-9.8 5.6 2-11-8.2-7.7 11.2-1.4z" fill="#ffd783"/>
  <path class="star twinkle" d="m401 59 3 8 8 3-8 3-3 8-3-8-8-3 8-3zm104-37 3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
</svg>
