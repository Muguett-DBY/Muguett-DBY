<svg xmlns="http://www.w3.org/2000/svg" width="420" height="176" viewBox="0 0 420 176" role="img" aria-labelledby="title desc">
  <title id="title">Open-source logbook</title>
  <desc id="desc">A few fixes shared upstream, with a little mascot and stars.</desc>
  <style>
    .surface{fill:#f7f8fc}.border{stroke:#e1e0ed}.ink{fill:#252d47}.muted{fill:#68718a}.mint{fill:#247965}.star{fill:#a18be0}.orbit{stroke:#d4cfeb}.panel{fill:#fff}
    @media(prefers-color-scheme:dark){.surface{fill:#11182b}.border{stroke:#303950}.ink{fill:#f2effb}.muted{fill:#b1bad0}.mint{fill:#68efd0}.star{fill:#bca7ff}.orbit{stroke:#3b3b59}.panel{fill:#192238}}
    @media(prefers-reduced-motion:no-preference){.twinkle{animation:twinkle 6s ease-in-out infinite}@keyframes twinkle{0%,100%{opacity:.4}50%{opacity:1}}}
  </style>
  <rect class="surface border" x="1" y="1" width="418" height="174" rx="16"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <circle cx="22" cy="26" r="3" fill="#efa1a2"/><circle cx="34" cy="26" r="3" fill="#ffd783"/><circle cx="46" cy="26" r="3" fill="#68c6ac"/>
    <text class="muted" x="62" y="30" font-family="Consolas,monospace" font-size="10" letter-spacing="1.3">OPEN SOURCE / LOGBOOK</text>
    <text class="ink" x="22" y="72" font-size="25" font-weight="700">A few fixes,</text>
    <text class="ink" x="22" y="103" font-size="25" font-weight="700">shared upstream.</text>
    <text class="mint" x="23" y="143" font-family="Consolas,monospace" font-size="10" letter-spacing=".5">IMAGING / TESTING / DEVELOPER TOOLS</text>
  </g>
  <path class="orbit" d="M288 115c17-44 60-58 102-26" fill="none" stroke-width="1.5" stroke-dasharray="4 6"/>
  <circle class="panel border" cx="343" cy="83" r="35"/>
  <g transform="translate(326 65) scale(.85)" shape-rendering="crispEdges">
    <path d="M8 8h6V4h12v4h6v6h4v18h-4v6H8v-6H4V14h4z" fill="#ffd783"/>
    <path d="M8 14h4v-4h8v4h-8v6H8z" fill="#fff0bf"/>
    <path d="M22 8h4v6h4v4h-4v-4h-4z" fill="#e6ad60"/>
    <path d="M12 24h3v4h-3zm13 0h3v4h-3z" fill="#29304a"/>
    <path d="M17 29h6v3h-6z" fill="#986556"/>
    <path d="M8 29h4v3H8zm20 0h4v3h-4z" fill="#efa1a2"/>
  </g>
  <path class="star twinkle" d="m289 57 3 7 7 3-7 3-3 7-3-7-7-3 7-3zm98 51 3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/>
  <circle class="mint" cx="388" cy="42" r="2.5"/>
</svg>
