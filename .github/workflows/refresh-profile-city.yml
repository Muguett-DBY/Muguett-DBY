name: Refresh contribution city

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-artwork
  cancel-in-progress: false

jobs:
  city:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build contribution city
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: scripts/profile-city-theme.json
      - name: Validate artwork
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path('profile-3d-contrib/custard-city.svg')
          root = ET.parse(path).getroot()
          assert root.tag == '{http://www.w3.org/2000/svg}svg'
          assert path.stat().st_size < 5 * 1024 * 1024
          assert not any(node.tag.rsplit('}', 1)[-1] in {'script', 'foreignObject'} for node in root.iter())
          print('Contribution city is a valid, self-contained SVG.')
          PY
      - name: Publish contribution city
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile-3d-contrib/custard-city.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public contribution city'
            git push
          fi
